name: amanghar_app
description: AmanGhar — Household Services Marketplace

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # firebase_storage: ^12.3.3   # LOCAL-FIRST: disabled for Spark plan — re-enable on Blaze
  firebase_messaging: ^15.1.3
  # cloud_functions: ^5.1.3     # LOCAL-FIRST: not used in client — re-enable if Cloud Fns added
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI & Design
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Fonts
  google_fonts: ^6.2.1

  # Logging
  logger: ^2.4.0

  # Encryption
  encrypt: ^5.0.3

  # Ads
  google_mobile_ads: ^5.1.0

  # Networking
  http: ^1.2.1

  # Utils
  intl: ^0.20.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  equatable: ^2.0.5
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3
  table_calendar: ^3.2.0
  firebase_app_check: ^0.3.2+10
  firebase_core_platform_interface: ^6.0.3  # pinned for google_mobile_ads compat
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.6.0         # Background task scheduling (Android WorkManager API)

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true   # enables localization code generation

  assets:
    #- assets/images/
    #- assets/icons/
    #- assets/lottie/
    #- assets/l10n/
